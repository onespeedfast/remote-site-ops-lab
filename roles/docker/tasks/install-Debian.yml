---
# Debian 12 configs
- name: Remove distro Docker packages that conflict
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Repo prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Folder for third part repo keys
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
- name: Download Docker's signing key
  ansible.builtin.get_url:
    url: "{{ docker_debian_gpg_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true
- name: Add Docker apt source, trusted only with that key
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: {{ docker_debian_repo_url }}
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
- name: Install Docker CE
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
