---
# Pick the install file for this OS family at run time:
# install-RedHat.yml on Rocky, install-Debian.yml on Debian.
- name: Install Docker CE for this OS family
  ansible.builtin.include_tasks:
    file: "install-{{ ansible_os_family }}.yml"
    apply:
      tags: [docker]
  tags: [docker]

- name: Python requests library
  ansible.builtin.package:
    name: python3-requests
    state: present

- name: Docker running now and at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Let the admin user run docker without sudo (root equivalent)
  ansible.builtin.user:
    name: "{{ docker_admin_user }}"
    groups: docker
    append: true
