---
# Role defaults: the LOWEST-priority values. group_vars override them.
# "x | default('y')" means: use x if it's set, otherwise y.
baseline_admin_user: "{{ narr_admin_user | default('labadmin') }}"
baseline_timezone: "{{ narr_timezone | default('UTC') }}"

# Login message /etc/motd group_vars set the real wording
baseline_motd_banner: "Authorized use only."
baseline_host_purpose: "unassigned"

# A site can add packages without editing the role
baseline_extra_packages: []
