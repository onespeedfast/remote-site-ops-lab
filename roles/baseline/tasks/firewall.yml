---
- name: Start and enable firewalld on Rocky
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Allow SSH in firewalld for Rocky
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled
  when: ansible_os_family == "RedHat"

# ufw order matters: allow ssh before enabling
- name: Allow SSH in ufw for Debian
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: ansible_os_family == "Debian"

- name: Enable ufw deny inbound by default for Debian
  community.general.ufw:
    state: enabled
    policy: deny
  when: ansible_os_family == "Debian"
