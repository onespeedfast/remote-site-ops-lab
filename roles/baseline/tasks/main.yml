---
# baseline entry point. Ansible runs this file; it pulls in the
# others in order. A tag on an import is copied onto every task
# inside that file.

- name: Load OS-specific values (vars/RedHat.yml or vars/Debian.yml)
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: [always]

- name: Packages
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Admin user, sudo and SSH key
  ansible.builtin.import_tasks: users.yml
  tags: [users]

- name: Time zone and time sync
  ansible.builtin.import_tasks: time.yml
  tags: [time]

- name: SELinux (Rocky)
  ansible.builtin.import_tasks: selinux.yml
  tags: [selinux]

- name: SSH demon
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Host firewall
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]

- name: Automatic security updates
  ansible.builtin.import_tasks: updates.yml
  tags: [updates]

- name: Login message
  ansible.builtin.import_tasks: motd.yml
  tags: [motd]
