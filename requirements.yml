---
# Collections this repo needs. Install with:
#  ansible-galaxy collection install -r requirements.yml
# Version ranges: newest release that still supports ansible-core 2.18.
collections:
  - name: community.docker    # docker_volume, docker_compose_v2
    version: ">=3.6.0,<6.0.0"
  - name: ansible.posix       # firewalld, selinux, authorized_key
    version: ">=1.5.0,<3.0.0"
  - name: community.general   # ufw, timezone
    version: ">=8.0.0,<14.0.0"
