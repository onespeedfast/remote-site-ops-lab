---
# NARR lab inventory. Host names match the Host entries in
#  ~/.ssh/config, so SSH (not this file) knows the IPs and the
#  ProxyJump through narr-hv01. No IPs are comitted to git.
all:
 children:
  # --- grouped by the job in the site ---
  bastion:
   hosts:
    narr-bastion:
  app:
   hosts:
    narr-app01:
  logging:
   hosts:
    narr-log01:
  # --- grouped by operating system ---
  os_rocky:
   hosts:
    narr-bastion:
    narr-app01:
  os_debian:
   hosts:
    narr-log01:
