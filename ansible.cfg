[defaults]
# Host list, relative to this file's folder
inventory = inventory/hosts.yml
# Wwhere the roles live
roles_path = roles
# Refuse unknown host keys
host_key_checking = True
# Don't leave .retry files around after a failure
retry_files_enabled = False
# Find Python on each host automatically, without warnings
interpreter_python = auto_silent
# Print how long each tast took at the end of a run
callbacks_enabled = ansible.posix.profile_tasks
# 8 GiB hypervisor: work on ONE host at a time so parallel
#  dnf/apt/docker pulls can't run out of memory
# this is something we`d increase when troubleshooting slow deployments 
#  on large infra
forks = 1
# Read the vault password from this file (outside the repo)
vault_password_file = ~/.narr-vault-pass

[privilege_escalation]
# Use sudo for tasks by default (labadmin has passwordless sudo)
# become means to su to root as needed
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# Fewer SSH round trips per task; matters over a slow link
pipelining = True

